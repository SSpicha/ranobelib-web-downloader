# nginx reverse proxy for ranobelib-web on Oracle Always-Free
# Installed on the VM host (apt install nginx). Serves :80 -> container :8080.
# No domain needed — access via the VM's public IP.
# For HTTPS later: get a free domain (e.g. duckdns) + certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;   # catch-all (IP-based access)

    # Increase upload/body size if needed (chapter lists can be large)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (SPA live updates if any)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # long book generation
        proxy_send_timeout 3600s;
    }
}
