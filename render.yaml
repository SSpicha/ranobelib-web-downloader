services:
  - type: web
    name: ranobelib-web
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KEEPALIVE
        value: "1"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      # Optional auth token for protected instance
      # - key: WEB_TOKEN
      #   value: "..."
    # NOTE: Render free tier does NOT support persistent disks.
    # Downloads live on the ephemeral container filesystem and are purged
    # by the in-app TTL cleanup (downloads + temp images, 1h).
    # If you upgrade to a paid plan, add a disk:
    #   disk:
    #     name: downloads
    #     mountPath: /app/downloads
    #     sizeGB: 1
